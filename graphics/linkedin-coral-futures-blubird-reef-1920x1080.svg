  <rect x="56" y="852" width="340" height="52" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="226" y="883" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#A8C4B0" text-anchor="middle">🐠  Adopt-a-Coral (individuals)</text>

  <rect x="412" y="852" width="380" height="52" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="602" y="883" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#A8C4B0" text-anchor="middle">⚖️  Verified Remediation (corps)</text>

  <rect x="808" y="852" width="360" height="52" rx="4" fill="#112418" stroke="#3DAA6E" stroke-width="1"/>
  <text x="988" y="883" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3DAA6E" text-anchor="middle">📈  Regulated Investment</text>

