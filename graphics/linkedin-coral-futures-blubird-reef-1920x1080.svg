  <!-- Subhead -->
  <text x="56" y="454" font-family="Arial, sans-serif" font-size="32" fill="#A8C4B0">Courts have been pricing coral at up to $17,000 per square meter for 40 years.</text>
  <text x="56" y="498" font-family="Arial, sans-serif" font-size="32" fill="#A8C4B0">Coral Futures and Blubird just created the affirmative counterpart instrument.</text>
  <text x="56" y="542" font-family="Arial, sans-serif" font-size="32" fill="#5A8068">One reef. Three use cases: adopt-a-coral, corporate remediation, regulated investment.</text>

  <!-- Divider 2 -->
  <rect x="56" y="582" width="80" height="4" fill="#3DAA6E"/>

  <!-- Four stat boxes -->
  <rect x="56" y="616" width="260" height="128" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="186" y="670" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#E8C97A" font-weight="900" text-anchor="middle">124,400</text>
  <text x="186" y="706" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">Reef Sections</text>
  <text x="186" y="724" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">tokenized</text>

  <rect x="330" y="616" width="260" height="128" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="460" y="670" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#F0F4FA" font-weight="900" text-anchor="middle">US$118M</text>
  <text x="460" y="706" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">pilot program</text>
  <text x="460" y="724" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">value</text>

  <rect x="604" y="616" width="260" height="128" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="734" y="670" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#F0F4FA" font-weight="900" text-anchor="middle">US$2B</text>
  <text x="734" y="706" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">full-scale</text>
  <text x="734" y="724" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">potential</text>

  <rect x="878" y="616" width="310" height="128" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
  <text x="1033" y="662" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#3DAA6E" font-weight="900" text-anchor="middle">40 YEARS</text>
  <text x="1033" y="698" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">of court precedent</text>
  <text x="1033" y="716" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">pricing this value</text>
  <text x="1033" y="732" font-family="Arial, sans-serif" font-size="13" fill="#5A8068" text-anchor="middle">$4,900–$17,000/sqm</text>

