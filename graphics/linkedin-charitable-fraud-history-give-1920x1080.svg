  <text x="1820" y="760" font-family="Arial Black" font-size="380" fill="#3DAA6E" opacity="0.05" font-weight="900" text-anchor="end">700</text>
  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · SOCIAL IMPACT · HISTORY · GIVE BLOCKCHAIN</text>
  <!-- Headline -->
  <text x="56" y="230" font-family="Arial Black, Arial, sans-serif" font-size="96" fill="#F0F4FA" font-weight="900" letter-spacing="-2">FROM MEDIEVAL</text>
