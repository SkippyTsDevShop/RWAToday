  <text x="156" y="732" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">Indulgence</text>
  <text x="156" y="750" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">scandal</text>
