  <text x="588" y="750" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">accountability gap</text>
  <rect x="704" y="658" width="200" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="804" y="706" font-family="Arial Black" font-size="28" fill="#F0F4FA" font-weight="900" text-anchor="middle">2022</text>
  <text x="804" y="732" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">GoFundMe</text>
