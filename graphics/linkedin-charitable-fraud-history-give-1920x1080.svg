  <text x="372" y="732" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">First charity</text>
  <text x="372" y="750" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">watchdog (UK)</text>
  <rect x="488" y="658" width="200" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
