  <text x="56" y="450" font-family="Arial Black, Arial, sans-serif" font-size="96" fill="#3DAA6E" font-weight="900" letter-spacing="-2">GOFUNDME SCAMS.</text>
  <rect x="56" y="486" width="1350" height="3" fill="#1E3020"/>
  <text x="56" y="546" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">700 years of charitable fraud. Every era built better administration.</text>
  <text x="56" y="590" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">None of it changed the underlying architecture. Blockchain does.</text>
  <rect x="56" y="626" width="80" height="4" fill="#3DAA6E"/>
