<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A1610"/>

  <!-- Subtle grid -->
  <g stroke="#111D14" stroke-width="1">
    <line x1="0" y1="216" x2="1920" y2="216"/>
    <line x1="0" y1="432" x2="1920" y2="432"/>
    <line x1="0" y1="648" x2="1920" y2="648"/>
    <line x1="0" y1="864" x2="1920" y2="864"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="1080" fill="#3DAA6E"/>

  <!-- Earth watermark -->
  <circle cx="1650" cy="580" r="420" fill="none" stroke="#3DAA6E" stroke-width="1" opacity="0.06"/>
  <circle cx="1650" cy="580" r="300" fill="none" stroke="#3DAA6E" stroke-width="1" opacity="0.05"/>
  <circle cx="1650" cy="580" r="180" fill="none" stroke="#3DAA6E" stroke-width="1" opacity="0.04"/>
  <!-- Lat/long lines -->
  <line x1="1650" y1="160" x2="1650" y2="1000" stroke="#3DAA6E" stroke-width="1" opacity="0.04"/>
  <line x1="1230" y1="580" x2="2070" y2="580" stroke="#3DAA6E" stroke-width="1" opacity="0.04"/>

  <!-- Overline -->
  <text x="56" y="88" font-family="'Courier New', monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">BLOCKCHAIN · SUPPLY CHAIN · SUSTAINABLE MINING</text>

  <!-- Main headline -->
  <text x="56" y="230" font-family="Arial Black, Arial, sans-serif" font-size="116" fill="#F0F4FA" font-weight="900" letter-spacing="-2">THE MINERALS</text>
  <text x="56" y="362" font-family="Arial Black, Arial, sans-serif" font-size="116" fill="#F0F4FA" font-weight="900" letter-spacing="-2">IN YOUR PHONE</text>
  <text x="56" y="494" font-family="Arial Black, Arial, sans-serif" font-size="116" fill="#3DAA6E" font-weight="900" letter-spacing="-2">CAME FROM SOMEWHERE.</text>

  <!-- Divider -->
  <rect x="56" y="534" width="1100" height="3" fill="#1E3020"/>

  <!-- Subhead -->
  <text x="56" y="606" font-family="Arial, sans-serif" font-size="32" fill="#A8C4B0">Blockchain is starting to prove where — and under what conditions.</text>
  <text x="56" y="650" font-family="Arial, sans-serif" font-size="32" fill="#A8C4B0">IBM/MineHub, RCS Global/Circulor, Minespider, and Element United</text>
  <text x="56" y="694" font-family="Arial, sans-serif" font-size="32" fill="#A8C4B0">are each building a different part of the answer.</text>

  <!-- Divider 2 -->
  <rect x="56" y="732" width="80" height="4" fill="#3DAA6E"/>

  <!-- Three stat boxes -->
  <rect x="56" y="764" width="310" height="120" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="211" y="822" font-family="Arial Black, Arial, sans-serif" font-size="46" fill="#E8C97A" font-weight="900" text-anchor="middle">60%+</text>
  <text x="211" y="858" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">of mining companies cite</text>
  <text x="211" y="876" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">transparency as #1 challenge</text>

  <rect x="382" y="764" width="310" height="120" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="537" y="822" font-family="Arial Black, Arial, sans-serif" font-size="46" fill="#F0F4FA" font-weight="900" text-anchor="middle">70%</text>
  <text x="537" y="858" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">of global cobalt comes</text>
  <text x="537" y="876" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">from the DRC</text>

  <rect x="708" y="764" width="340" height="120" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
  <text x="878" y="822" font-family="Arial Black, Arial, sans-serif" font-size="46" fill="#3DAA6E" font-weight="900" text-anchor="middle">2–3×</text>
  <text x="878" y="858" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">revenue for traceable</text>
  <text x="878" y="876" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">supply chains (WEF)</text>

  <!-- Brand -->
  <text x="56" y="990" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#F0F4FA" font-weight="900">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="20" font-weight="400">.news</tspan></text>
  <text x="56" y="1032" font-family="'Courier New', monospace" font-size="14" fill="#3A5A40">rwatoday.news/element-united-blockchain-sustainable-mining-transparency-2026</text>

</svg>
