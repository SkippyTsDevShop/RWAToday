  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · SOCIAL IMPACT · DIGITAL IDENTITY · FUTURE USE CASE</text>
  <text x="56" y="230" font-family="Arial Black, Arial, sans-serif" font-size="118" fill="#F0F4FA" font-weight="900" letter-spacing="-2">1.4 BILLION PEOPLE</text>
  <text x="56" y="348" font-family="Arial Black, Arial, sans-serif" font-size="118" fill="#F0F4FA" font-weight="900" letter-spacing="-2">HAVE NO LEGAL</text>
  <text x="56" y="466" font-family="Arial Black, Arial, sans-serif" font-size="118" fill="#3DAA6E" font-weight="900" letter-spacing="-2">IDENTITY.</text>
  <rect x="56" y="502" width="1350" height="3" fill="#1E3020"/>
  <text x="56" y="562" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">No birth certificate. No bank account. No property rights. No formal employment.</text>
  <text x="56" y="606" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">For 17% of humanity, legal existence is not guaranteed. Blockchain changes that.</text>
  <rect x="56" y="642" width="80" height="4" fill="#3DAA6E"/>
