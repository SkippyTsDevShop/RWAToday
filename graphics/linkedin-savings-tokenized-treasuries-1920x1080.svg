<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1920" height="1080" fill="#0A1610"/>
  <g stroke="#111D14" stroke-width="1">
    <line x1="0" y1="216" x2="1920" y2="216"/><line x1="0" y1="432" x2="1920" y2="432"/>
    <line x1="0" y1="648" x2="1920" y2="648"/><line x1="0" y1="864" x2="1920" y2="864"/>
    <line x1="480" y1="0" x2="480" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  <rect x="0" y="0" width="8" height="1080" fill="#3DAA6E"/>

  <!-- Bar chart watermark -->
  <rect x="1600" y="500" width="70" height="480" fill="#3DAA6E" opacity="0.05" rx="4"/>
  <rect x="1710" y="100" width="70" height="880" fill="#3DAA6E" opacity="0.08" rx="4"/>
  <rect x="1820" y="280" width="70" height="700" fill="#3DAA6E" opacity="0.05" rx="4"/>

  <!-- Category -->
  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · CONSUMER FINANCE · TOKENIZED TREASURIES</text>

  <!-- Two-number comparison — left vs right -->
  <!-- Left side: the bad number -->
  <text x="56" y="180" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#5A8068" font-weight="900" letter-spacing="3">YOUR SAVINGS ACCOUNT</text>
  <text x="56" y="360" font-family="Arial Black, Arial, sans-serif" font-size="220" fill="#5A8068" font-weight="900" letter-spacing="-4">0.5%</text>
  <text x="56" y="420" font-family="Arial, sans-serif" font-size="24" fill="#3A5A40">annual yield — major banks, 2026</text>

  <!-- VS divider -->
  <rect x="56" y="460" width="860" height="3" fill="#1E3020"/>
  <text x="56" y="530" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#F0F4FA" font-weight="900" letter-spacing="3">TOKENIZED TREASURIES</text>
  <text x="56" y="720" font-family="Arial Black, Arial, sans-serif" font-size="220" fill="#3DAA6E" font-weight="900" letter-spacing="-4">4.8%</text>
  <text x="56" y="780" font-family="Arial, sans-serif" font-size="24" fill="#5A8068">T-bill yield passed directly to the holder</text>

  <!-- Right side: the explanation -->
  <rect x="980" y="140" width="3" height="760" fill="#1E3020"/>

  <text x="1040" y="200" font-family="Arial Black, Arial, sans-serif" font-size="42" fill="#F0F4FA" font-weight="900">THE BANK IS KEEPING</text>
  <text x="1040" y="258" font-family="Arial Black, Arial, sans-serif" font-size="42" fill="#F0F4FA" font-weight="900">THE DIFFERENCE.</text>

  <rect x="1040" y="290" width="80" height="4" fill="#3DAA6E"/>

  <text x="1040" y="356" font-family="Arial, sans-serif" font-size="26" fill="#A8C4B0">The Fed funds rate: 5.25%.</text>
  <text x="1040" y="396" font-family="Arial, sans-serif" font-size="26" fill="#A8C4B0">US Treasury T-bills yield: 4.8%.</text>
  <text x="1040" y="436" font-family="Arial, sans-serif" font-size="26" fill="#A8C4B0">Your savings account pays: 0.5%.</text>
  <text x="1040" y="490" font-family="Arial, sans-serif" font-size="26" fill="#5A8068">The bank captures the 4.3-point</text>
  <text x="1040" y="530" font-family="Arial, sans-serif" font-size="26" fill="#5A8068">spread — every single year.</text>

  <!-- Three stat boxes on right -->
  <rect x="1040" y="580" width="240" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="1160" y="628" font-family="Arial Black" font-size="36" fill="#5A8068" font-weight="900" text-anchor="middle">0.5%</text>
  <text x="1160" y="658" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">Bank savings APY</text>
  <text x="1160" y="676" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">major banks</text>

  <rect x="1300" y="580" width="240" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="1420" y="628" font-family="Arial Black" font-size="36" fill="#E8C97A" font-weight="900" text-anchor="middle">4.3%</text>
  <text x="1420" y="658" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">kept by the bank</text>
  <text x="1420" y="676" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">per year, per depositor</text>

  <rect x="1040" y="710" width="500" height="110" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
  <text x="1290" y="754" font-family="Arial Black" font-size="22" fill="#3DAA6E" font-weight="900" text-anchor="middle">TOKENIZED TREASURIES</text>
  <text x="1290" y="782" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">Pass the T-bill yield directly to the holder</text>
  <text x="1290" y="800" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">No bank intermediary. No spread capture.</text>

  <text x="1040" y="880" font-family="Arial, sans-serif" font-size="22" fill="#5A8068">130M US households × $344/yr avg gap =</text>
  <text x="1040" y="912" font-family="Arial Black" font-size="26" fill="#3DAA6E" font-weight="900">~$45 billion transferred from depositors</text>
  <text x="1040" y="944" font-family="Arial Black" font-size="26" fill="#3DAA6E" font-weight="900">to bank shareholders — annually.</text>

  <!-- Brand -->
  <text x="56" y="1000" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#F0F4FA" font-weight="900">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="20" font-weight="400">.news</tspan></text>
  <text x="56" y="1042" font-family="Courier New, monospace" font-size="12" fill="#3A5A40">rwatoday.news/savings-account-tokenized-treasuries-yield-gap-blockchain-2026</text>
</svg>
