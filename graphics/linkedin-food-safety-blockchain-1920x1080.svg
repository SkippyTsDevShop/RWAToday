<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A1610"/>

  <!-- Subtle grid -->
  <g stroke="#152218" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="384" y1="0" x2="384" y2="1080"/>
    <line x1="768" y1="0" x2="768" y2="1080"/>
    <line x1="1152" y1="0" x2="1152" y2="1080"/>
    <line x1="1536" y1="0" x2="1536" y2="1080"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="10" height="1080" fill="#3DAA6E"/>

  <!-- Top overline -->
  <text x="80" y="130" font-family="'Courier New', monospace" font-size="18" fill="#3DAA6E" letter-spacing="6" font-weight="700">REAL-WORLD ASSETS</text>

  <!-- Main headline — 4 lines -->
  <text x="80" y="280" font-family="Arial Black, Arial, sans-serif" font-size="148" fill="#F0F4FA" font-weight="900">THE FOOD</text>
  <text x="80" y="440" font-family="Arial Black, Arial, sans-serif" font-size="148" fill="#F0F4FA" font-weight="900">SUPPLY CHAIN</text>
  <text x="80" y="600" font-family="Arial Black, Arial, sans-serif" font-size="148" fill="#F0F4FA" font-weight="900">NEEDS</text>
  <text x="80" y="760" font-family="Arial Black, Arial, sans-serif" font-size="148" fill="#3DAA6E" font-weight="900">BLOCKCHAIN.</text>

  <!-- Subhead -->
  <text x="80" y="860" font-family="Arial, sans-serif" font-size="34" fill="#A8C4B0" font-weight="400">The technology exists. This week&#x2019;s recalls prove why it matters.</text>

  <!-- Divider -->
  <rect x="80" y="910" width="100" height="4" fill="#3DAA6E"/>

  <!-- URL + Brand -->
  <text x="80" y="980" font-family="Arial, sans-serif" font-size="22" fill="#3DAA6E" font-weight="700">RWAToday.news</text>
  <text x="80" y="1012" font-family="'Courier New', monospace" font-size="16" fill="#3A5A40">rwatoday.news/food-supply-chain-blockchain-lettuce-egg-recall-2026</text>

  <!-- Right side — decorative chain nodes -->
  <g opacity="0.18">
    <circle cx="1620" cy="220" r="180" fill="none" stroke="#3DAA6E" stroke-width="2"/>
    <circle cx="1620" cy="220" r="130" fill="none" stroke="#3DAA6E" stroke-width="1.5"/>
    <circle cx="1620" cy="220" r="80" fill="none" stroke="#3DAA6E" stroke-width="1"/>
    <circle cx="1620" cy="220" r="30" fill="#3DAA6E"/>
  </g>
  <g opacity="0.12">
    <circle cx="1750" cy="700" r="220" fill="none" stroke="#3DAA6E" stroke-width="2"/>
    <circle cx="1750" cy="700" r="160" fill="none" stroke="#3DAA6E" stroke-width="1.5"/>
    <circle cx="1750" cy="700" r="100" fill="none" stroke="#3DAA6E" stroke-width="1"/>
    <circle cx="1750" cy="700" r="40" fill="#3DAA6E"/>
  </g>
  <g opacity="0.08">
    <circle cx="1400" cy="860" r="120" fill="none" stroke="#3DAA6E" stroke-width="1.5"/>
    <circle cx="1400" cy="860" r="70" fill="none" stroke="#3DAA6E" stroke-width="1"/>
  </g>
  <!-- Connecting lines between rings -->
  <line x1="1620" y1="220" x2="1750" y2="700" stroke="#3DAA6E" stroke-width="1" opacity="0.1" stroke-dasharray="8,6"/>
  <line x1="1750" y1="700" x2="1400" y2="860" stroke="#3DAA6E" stroke-width="1" opacity="0.08" stroke-dasharray="8,6"/>

</svg>
