<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1920" height="1080" fill="#0A1610"/>
  <g stroke="#111D14" stroke-width="1">
    <line x1="0" y1="216" x2="1920" y2="216"/><line x1="0" y1="432" x2="1920" y2="432"/>
    <line x1="0" y1="648" x2="1920" y2="648"/><line x1="0" y1="864" x2="1920" y2="864"/>
    <line x1="480" y1="0" x2="480" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  <rect x="0" y="0" width="8" height="1080" fill="#3DAA6E"/>
  <!-- Flight path arcs -->
  <path d="M 1200 900 Q 1500 200 1900 400" fill="none" stroke="#3DAA6E" opacity="0.05" stroke-width="3" stroke-dasharray="20,15"/>
  <path d="M 1100 950 Q 1600 300 1920 500" fill="none" stroke="#3DAA6E" opacity="0.04" stroke-width="2" stroke-dasharray="15,12"/>
  <path d="M 1300 850 Q 1450 100 1850 300" fill="none" stroke="#3DAA6E" opacity="0.03" stroke-width="1.5" stroke-dasharray="10,10"/>
  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · CONSUMER FINANCE · COUNTERPARTY RISK</text>
  <text x="56" y="224" font-family="Arial Black, Arial, sans-serif" font-size="118" fill="#F0F4FA" font-weight="900" letter-spacing="-2">YOUR AIRLINE MILES</text>
  <text x="56" y="346" font-family="Arial Black, Arial, sans-serif" font-size="118" fill="#F0F4FA" font-weight="900" letter-spacing="-2">ARE WORTH $48B.</text>
  <text x="56" y="468" font-family="Arial Black, Arial, sans-serif" font-size="88" fill="#3DAA6E" font-weight="900" letter-spacing="-1">THE AIRLINE CAN CHANGE THE RULES TOMORROW.</text>
  <rect x="56" y="504" width="1450" height="3" fill="#1E3020"/>
  <text x="56" y="562" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">Devaluation. Expiry. Rule changes. 30 days notice. No consent required.</text>
  <text x="56" y="606" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">You hold a unilateral liability of the airline — not an asset you own.</text>
  <rect x="56" y="642" width="80" height="4" fill="#3DAA6E"/>
  <rect x="56" y="674" width="280" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="196" y="726" font-family="Arial Black" font-size="44" fill="#E8C97A" font-weight="900" text-anchor="middle">$48B</text>
  <text x="196" y="760" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">unredeemed miles</text>
  <text x="196" y="778" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">(Delta, United, American)</text>
  <rect x="352" y="674" width="280" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="492" y="726" font-family="Arial Black" font-size="44" fill="#F0F4FA" font-weight="900" text-anchor="middle">$8B</text>
  <text x="492" y="760" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">Delta's disclosed</text>
  <text x="492" y="778" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">balance sheet value</text>
  <rect x="648" y="674" width="280" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="788" y="720" font-family="Arial Black" font-size="30" fill="#F0F4FA" font-weight="900" text-anchor="middle">30 DAYS</text>
  <text x="788" y="752" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">typical notice period</text>
  <text x="788" y="770" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">for rule changes</text>
  <rect x="944" y="674" width="380" height="110" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
  <text x="1134" y="716" font-family="Arial Black" font-size="22" fill="#3DAA6E" font-weight="900" text-anchor="middle">TOKENIZED LOYALTY POINTS</text>
  <text x="1134" y="744" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">Rules encoded in smart contract</text>
  <text x="1134" y="762" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">Cannot be unilaterally changed</text>
  <text x="56" y="878" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="2">YOU PAID FOR THE MILES. YOU DON'T OWN THEM. THAT GAP IS A DESIGN CHOICE.</text>
  <text x="56" y="1000" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#F0F4FA" font-weight="900">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="20" font-weight="400">.news</tspan></text>
  <text x="56" y="1042" font-family="Courier New, monospace" font-size="12" fill="#3A5A40">rwatoday.news/airline-miles-48-billion-counterparty-risk-blockchain</text>
</svg>
