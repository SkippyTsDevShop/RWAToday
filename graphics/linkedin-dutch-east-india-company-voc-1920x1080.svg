  <text x="1820" y="480" font-family="Arial Black" font-size="200" fill="#3DAA6E" opacity="0.05" font-weight="900" text-anchor="end">1602</text>
  <text x="1820" y="700" font-family="Arial Black" font-size="200" fill="#3DAA6E" opacity="0.05" font-weight="900" text-anchor="end">2026</text>
  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · HISTORY · MARKETS · DTCC OCTOBER 2026</text>
  <text x="56" y="222" font-family="Arial Black, Arial, sans-serif" font-size="100" fill="#F0F4FA" font-weight="900" letter-spacing="-2">THE DUTCH EAST INDIA</text>
  <text x="56" y="334" font-family="Arial Black, Arial, sans-serif" font-size="100" fill="#F0F4FA" font-weight="900" letter-spacing="-2">COMPANY WAS WORTH</text>
  <text x="56" y="446" font-family="Arial Black, Arial, sans-serif" font-size="130" fill="#3DAA6E" font-weight="900" letter-spacing="-2">$8 TRILLION.</text>
  <rect x="56" y="480" width="1250" height="3" fill="#1E3020"/>
  <text x="56" y="540" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">It invented the stock market. The broker. The short seller. The futures contract.</text>
  <text x="56" y="584" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">All of it, to trade one company's shares. March 20, 1602.</text>
  <text x="56" y="632" font-family="Arial, sans-serif" font-size="30" fill="#3DAA6E" font-weight="700">The DTCC's October 2026 tokenization launch is the next chapter.</text>
  <rect x="56" y="666" width="80" height="4" fill="#3DAA6E"/>
  <!-- Timeline boxes -->
  <rect x="56" y="698" width="220" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="166" y="746" font-family="Arial Black" font-size="30" fill="#E8C97A" font-weight="900" text-anchor="middle">1602</text>
  <text x="166" y="772" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">World's first IPO</text>
  <text x="166" y="790" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">1,143 investors</text>
  <rect x="292" y="698" width="220" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="402" y="746" font-family="Arial Black" font-size="30" fill="#F0F4FA" font-weight="900" text-anchor="middle">1611</text>
  <text x="402" y="772" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">Amsterdam Beurs</text>
  <text x="402" y="790" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">first stock exchange</text>
  <rect x="528" y="698" width="220" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="638" y="746" font-family="Arial Black" font-size="30" fill="#F0F4FA" font-weight="900" text-anchor="middle">1968</text>
  <text x="638" y="772" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">Paperwork Crisis</text>
  <text x="638" y="790" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">→ DTCC created</text>
  <rect x="764" y="698" width="280" height="110" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
  <text x="904" y="742" font-family="Arial Black" font-size="26" fill="#3DAA6E" font-weight="900" text-anchor="middle">OCT 2026</text>
  <text x="904" y="768" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">DTCC tokenized securities</text>
  <text x="904" y="786" font-family="Arial" font-size="12" fill="#5A8068" text-anchor="middle">full commercial launch</text>
  <text x="56" y="904" font-family="Georgia, serif" font-size="20" fill="#5A8068" font-style="italic">"The record must be authoritative. The record must be transferable. The record must be trustworthy."</text>
  <text x="56" y="930" font-family="Courier New, monospace" font-size="11" fill="#3A5A40">— True of the VOC ledger in 1602. True of the blockchain in 2026.</text>
  <text x="56" y="1000" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#F0F4FA" font-weight="900">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="20" font-weight="400">.news</tspan></text>
  <text x="56" y="1042" font-family="Courier New, monospace" font-size="12" fill="#3A5A40">rwatoday.news/dutch-east-india-company-voc-first-ipo-dtcc-tokenized-securities-history</text>
