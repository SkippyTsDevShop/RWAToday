<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A1610"/>

  <!-- Subtle grid -->
  <g stroke="#111D14" stroke-width="1">
    <line x1="0" y1="216" x2="1920" y2="216"/>
    <line x1="0" y1="432" x2="1920" y2="432"/>
    <line x1="0" y1="648" x2="1920" y2="648"/>
    <line x1="0" y1="864" x2="1920" y2="864"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="1080" fill="#3DAA6E"/>

  <!-- Newspaper texture suggestion — faint aged diagonal lines on right -->
  <line x1="900" y1="0" x2="1920" y2="1080" stroke="#3DAA6E" opacity="0.03" stroke-width="80"/>
  <line x1="1100" y1="0" x2="1920" y2="880" stroke="#3DAA6E" opacity="0.03" stroke-width="60"/>
  <line x1="1300" y1="0" x2="1920" y2="620" stroke="#3DAA6E" opacity="0.02" stroke-width="40"/>

  <!-- Year watermark -->
  <text x="1800" y="680" font-family="Arial Black, sans-serif" font-size="420" fill="#3DAA6E" opacity="0.05" font-weight="900" text-anchor="end">1921</text>

  <!-- Overline -->
  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · ENERGY · HISTORY · BLOCKCHAIN</text>

  <!-- Faux newspaper masthead quote -->
  <rect x="56" y="110" width="860" height="80" rx="4" fill="#071009" stroke="#265235" stroke-width="1"/>
  <text x="76" y="145" font-family="Georgia, serif" font-size="15" fill="#5A8068" font-style="italic">New York Tribune, Sunday, December 4, 1921</text>
  <text x="76" y="170" font-family="Georgia, serif" font-size="16" fill="#A8C4B0" font-weight="bold">"Ford Would Replace Gold With Energy Currency and Stop Wars"</text>

  <!-- Main headline -->
  <text x="56" y="290" font-family="Arial Black, Arial, sans-serif" font-size="118" fill="#F0F4FA" font-weight="900" letter-spacing="-2">HENRY FORD</text>
  <text x="56" y="410" font-family="Arial Black, Arial, sans-serif" font-size="88" fill="#3DAA6E" font-weight="900" letter-spacing="-1">PROPOSED THIS IN 1921.</text>

  <!-- Divider -->
  <rect x="56" y="446" width="1300" height="3" fill="#1E3020"/>

  <!-- Subhead -->
  <text x="56" y="512" font-family="Arial, sans-serif" font-size="34" fill="#A8C4B0">Currency backed by kilowatt-hours. Immune to banking control.</text>
  <text x="56" y="558" font-family="Arial, sans-serif" font-size="34" fill="#A8C4B0">Incapable of funding wars. He had the idea exactly right.</text>
  <text x="56" y="618" font-family="Arial, sans-serif" font-size="38" fill="#3DAA6E" font-weight="700">He had no blockchain. Now we do.</text>

  <!-- Divider 2 -->
  <rect x="56" y="658" width="80" height="4" fill="#3DAA6E"/>

  <!-- Three boxes -->
  <rect x="56" y="692" width="310" height="120" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="211" y="746" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#E8C97A" font-weight="900" text-anchor="middle">1921</text>
  <text x="211" y="780" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">Ford's energy currency</text>
  <text x="211" y="798" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">proposal published</text>

  <rect x="382" y="692" width="310" height="120" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="537" y="746" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#F0F4FA" font-weight="900" text-anchor="middle">87 YRS</text>
  <text x="537" y="780" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">before Satoshi published</text>
  <text x="537" y="798" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">the Bitcoin white paper</text>

  <rect x="708" y="692" width="310" height="120" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
  <text x="863" y="746" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#3DAA6E" font-weight="900" text-anchor="middle">2026</text>
  <text x="863" y="780" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">the infrastructure</text>
  <text x="863" y="798" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">finally exists</text>

  <!-- Ford quote -->
  <text x="56" y="896" font-family="Georgia, serif" font-size="20" fill="#5A8068" font-style="italic">"The essential evil of gold is the fact that it can be controlled. Break the control and you stop war."</text>
  <text x="56" y="924" font-family="Courier New, monospace" font-size="12" fill="#3A5A40">— Henry Ford, 1921</text>

  <!-- Brand -->
  <text x="56" y="1000" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#F0F4FA" font-weight="900">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="20" font-weight="400">.news</tspan></text>
  <text x="56" y="1042" font-family="Courier New, monospace" font-size="13" fill="#3A5A40">rwatoday.news/henry-ford-energy-currency-1921-blockchain-rwa-green-power-sovereignty-2026</text>

</svg>
