<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Background -->
  <rect width="1128" height="191" fill="#0F2318"/>

  <!-- Subtle grid texture -->
  <g stroke="#112918" stroke-width="1">
    <line x1="0" y1="63" x2="1128" y2="63"/>
    <line x1="0" y1="127" x2="1128" y2="127"/>
    <line x1="282" y1="0" x2="282" y2="191"/>
    <line x1="564" y1="0" x2="564" y2="191"/>
    <line x1="846" y1="0" x2="846" y2="191"/>
  </g>

  <!-- Left accent bar — full height -->
  <rect x="0" y="0" width="5" height="191" fill="#3DAA6E"/>

  <!-- Safe zone: left 220px is kept clear for profile photo overlap -->
  <!-- All content starts at x=240 -->

  <!-- Wordmark -->
  <text x="240" y="82" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" fill="#F0F4FA" letter-spacing="-1">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="28" font-weight="400">.news</tspan></text>

  <!-- Tagline -->
  <text x="242" y="120" font-family="Arial, sans-serif" font-size="18" fill="#5A8068" letter-spacing="1">Real World Assets — Tokenized</text>

  <!-- Divider -->
  <rect x="242" y="134" width="500" height="1" fill="#1E3020"/>

  <!-- Descriptor -->
  <text x="242" y="158" font-family="Courier New, monospace" font-size="12" fill="#3DAA6E" letter-spacing="3">INDEPENDENT · EDITORIAL · RWA TOKENIZATION COVERAGE</text>

  <!-- Right side decorative circles (depth rings) -->
  <circle cx="1060" cy="95" r="130" fill="none" stroke="#3DAA6E" opacity="0.06" stroke-width="1.5"/>
  <circle cx="1060" cy="95" r="85" fill="none" stroke="#3DAA6E" opacity="0.06" stroke-width="1"/>
  <circle cx="1060" cy="95" r="45" fill="none" stroke="#3DAA6E" opacity="0.05" stroke-width="1"/>

</svg>
