  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="1080" fill="#3DAA6E"/>

  <!-- Watermark — heart/drop shape suggestion via circle -->
  <circle cx="1680" cy="560" r="440" fill="none" stroke="#3DAA6E" opacity="0.04" stroke-width="2"/>
  <circle cx="1680" cy="560" r="300" fill="none" stroke="#3DAA6E" opacity="0.04" stroke-width="1"/>
  <text x="1680" y="760" font-family="Arial Black, sans-serif" font-size="560" fill="#3DAA6E" opacity="0.035" font-weight="900" text-anchor="middle">♥</text>

  <!-- Overline -->
  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · SOCIAL IMPACT · BLOCKCHAIN</text>

  <!-- Main headline — two punchy lines -->
  <text x="56" y="240" font-family="Arial Black, Arial, sans-serif" font-size="128" fill="#F0F4FA" font-weight="900" letter-spacing="-2">IMPACT IS A</text>
  <text x="56" y="382" font-family="Arial Black, Arial, sans-serif" font-size="128" fill="#3DAA6E" font-weight="900" letter-spacing="-2">REAL-WORLD ASSET.</text>

  <!-- Divider -->
  <rect x="56" y="418" width="1350" height="3" fill="#1E3020"/>

  <!-- Subhead -->
  <text x="56" y="488" font-family="Arial, sans-serif" font-size="34" fill="#A8C4B0">A drilled well, a funded surgery, a child who stayed in school.</text>
  <text x="56" y="534" font-family="Arial, sans-serif" font-size="34" fill="#A8C4B0">The verification question is identical to a tokenized Treasury bill.</text>
  <text x="56" y="580" font-family="Arial, sans-serif" font-size="34" fill="#5A8068">The sector has $40B in financial RWA infrastructure.</text>
  <text x="56" y="626" font-family="Arial, sans-serif" font-size="34" fill="#5A8068">Almost nothing for impact RWAs. That gap is the opportunity.</text>

  <!-- Divider 2 -->
  <rect x="56" y="664" width="80" height="4" fill="#3DAA6E"/>

  <!-- Three stat boxes -->
  <rect x="56" y="700" width="310" height="120" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="211" y="756" font-family="Arial Black, Arial, sans-serif" font-size="46" fill="#E8C97A" font-weight="900" text-anchor="middle">$1.1T</text>
  <text x="211" y="794" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">global impact investing</text>
  <text x="211" y="812" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">market — mostly self-reported</text>

  <rect x="382" y="700" width="310" height="120" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
  <text x="537" y="756" font-family="Arial Black, Arial, sans-serif" font-size="46" fill="#F0F4FA" font-weight="900" text-anchor="middle">$40B</text>
  <text x="537" y="794" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">financial RWA infrastructure</text>
  <text x="537" y="812" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">built — impact RWA: almost zero</text>

  <rect x="708" y="700" width="360" height="120" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
  <text x="888" y="756" font-family="Arial Black, Arial, sans-serif" font-size="36" fill="#3DAA6E" font-weight="900" text-anchor="middle">GIVE BLOCKCHAIN</text>
  <text x="888" y="794" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">+ WHOlives.org</text>
  <text x="888" y="812" font-family="Arial, sans-serif" font-size="14" fill="#5A8068" text-anchor="middle">the model in practice</text>

  <!-- Bottom label -->
  <text x="56" y="900" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="2">THE SECTOR JUST HASN'T BUILT THE INFRASTRUCTURE YET.</text>

  <!-- Brand -->
  <text x="56" y="990" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#F0F4FA" font-weight="900">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="20" font-weight="400">.news</tspan></text>
  <text x="56" y="1032" font-family="Courier New, monospace" font-size="13" fill="#3A5A40">rwatoday.news/impact-is-a-real-world-asset-blockchain-charitable-outcomes-2026</text>

