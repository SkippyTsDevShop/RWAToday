  <text x="462" y="718" font-family="Arial Black" font-size="38" fill="#F0F4FA" font-weight="900" text-anchor="middle">$400M</text>
  <text x="462" y="750" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">Bob Dylan catalog</text>
  <text x="462" y="768" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">sold to UMG</text>
  <rect x="608" y="672" width="260" height="110" rx="6" fill="#112418" stroke="#265235" stroke-width="1"/>
