  <text x="56" y="88" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="5" font-weight="700">ANALYSIS · ALTERNATIVE ASSETS · MUSIC · BLOCKCHAIN</text>
  <text x="56" y="230" font-family="Arial Black, Arial, sans-serif" font-size="108" fill="#F0F4FA" font-weight="900" letter-spacing="-2">MUSIC ROYALTIES</text>
