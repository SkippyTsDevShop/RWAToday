  <text x="56" y="466" font-family="Arial Black, Arial, sans-serif" font-size="108" fill="#3DAA6E" font-weight="900" letter-spacing="-2">ASSET CLASS.</text>
  <rect x="56" y="502" width="1300" height="3" fill="#1E3020"/>
  <text x="56" y="560" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">Bob Dylan: $400M. Springsteen: $500M. Bieber: $200M.</text>
  <text x="56" y="604" font-family="Arial, sans-serif" font-size="30" fill="#A8C4B0">Minimum to invest used to be $1 million. Now it's $50.</text>
