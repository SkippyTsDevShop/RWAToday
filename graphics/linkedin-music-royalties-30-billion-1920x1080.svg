  <text x="186" y="750" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">annual catalog</text>
  <text x="186" y="768" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">transaction market</text>
