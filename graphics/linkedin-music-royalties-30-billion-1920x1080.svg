  <text x="1074" y="710" font-family="Arial Black" font-size="24" fill="#3DAA6E" font-weight="900" text-anchor="middle">ROYAL · ANOTHERBLOCK</text>
  <text x="1074" y="738" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">Fractional royalties from $50</text>
  <text x="1074" y="756" font-family="Arial" font-size="13" fill="#5A8068" text-anchor="middle">Smart contracts distribute automatically</text>
  <text x="56" y="874" font-family="Courier New, monospace" font-size="13" fill="#3DAA6E" letter-spacing="2">THE ASSET EXISTS. THE MINIMUM INVESTMENT WAS THE BARRIER. BLOCKCHAIN REMOVED IT.</text>
