    <rect x="144" y="144" width="120" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="204" y="167" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">ENERGY</text>

    <rect x="278" y="144" width="100" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="328" y="167" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">WEEKLY</text>

    <rect x="0" y="192" width="170" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="85" y="215" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">CASE STUDIES</text>

    <rect x="184" y="192" width="120" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="244" y="215" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">EMERGING</text>

    <rect x="318" y="192" width="116" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="376" y="215" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">ANALYSIS</text>

    <rect x="0" y="240" width="200" height="36" rx="4" fill="#3DAA6E"/>
    <text x="100" y="263" font-family="'Courier New', monospace" font-size="11" fill="#0A1610" text-anchor="middle" letter-spacing="2" font-weight="700">TOP VOICES</text>

    <rect x="214" y="240" width="170" height="36" rx="4" fill="#3DAA6E"/>
    <text x="299" y="263" font-family="'Courier New', monospace" font-size="11" fill="#0A1610" text-anchor="middle" letter-spacing="2" font-weight="700">FOOD SAFETY</text>

    <rect x="0" y="288" width="150" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="75" y="311" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">STABLECOINS</text>

    <rect x="164" y="288" width="100" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="214" y="311" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">DYOR</text>

    <rect x="278" y="288" width="156" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
    <text x="356" y="311" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="2">BEGINNER</text>

    <!-- Stats row -->
