<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">

  <!-- Background -->
  <rect width="1200" height="628" fill="#0A1610"/>

  <!-- Subtle grid -->
  <g stroke="#121F15" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="314" x2="1200" y2="314"/>
    <line x1="0" y1="471" x2="1200" y2="471"/>
    <line x1="300" y1="0" x2="300" y2="628"/>
    <line x1="600" y1="0" x2="600" y2="628"/>
    <line x1="900" y1="0" x2="900" y2="628"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="628" fill="#3DAA6E"/>

  <!-- Large decorative 100 — background watermark -->
  <text x="820" y="480" font-family="Arial Black, Arial, sans-serif" font-size="420" fill="#3DAA6E" opacity="0.05" font-weight="900" text-anchor="middle">100</text>

  <!-- Top label -->
  <text x="48" y="72" font-family="'Courier New', monospace" font-size="13" fill="#3DAA6E" letter-spacing="4" font-weight="700">MILESTONE</text>

  <!-- Big 100 -->
  <text x="48" y="220" font-family="Arial Black, Arial, sans-serif" font-size="200" fill="#3DAA6E" font-weight="900" letter-spacing="-6">100</text>

  <!-- ARTICLES text next to/below the 100 -->
  <text x="52" y="276" font-family="Arial Black, Arial, sans-serif" font-size="56" fill="#F0F4FA" font-weight="900" letter-spacing="8">ARTICLES</text>

  <!-- Divider -->
  <rect x="48" y="304" width="520" height="3" fill="#3DAA6E"/>

  <!-- Subhead -->
  <text x="48" y="352" font-family="Arial, sans-serif" font-size="22" fill="#A8C4B0">Independent coverage of the tokenized economy.</text>
  <text x="48" y="382" font-family="Arial, sans-serif" font-size="22" fill="#A8C4B0">From Treasuries to real estate to emerging markets.</text>
  <text x="48" y="412" font-family="Arial, sans-serif" font-size="22" fill="#A8C4B0">From the food supply chain to parametric insurance.</text>

