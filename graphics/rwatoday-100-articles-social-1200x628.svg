  <text x="48" y="510" font-family="Arial Black, Arial, sans-serif" font-size="38" fill="#F0F4FA" font-weight="900">RWA<tspan fill="#3DAA6E">Today</tspan><tspan fill="#5A8068" font-size="22" font-weight="400">.news</tspan></text>

  <!-- URL -->
  <text x="48" y="548" font-family="'Courier New', monospace" font-size="15" fill="#3A5A40" letter-spacing="1">rwatoday.news</text>

