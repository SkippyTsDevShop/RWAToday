    <text x="401" y="71" font-family="'Courier New', monospace" font-size="11" fill="#3DAA6E" text-anchor="middle" letter-spacing="1">RWA</text>

    <rect x="0" y="96" width="220" height="36" rx="4" fill="#112418" stroke="#265235" stroke-width="1"/>
