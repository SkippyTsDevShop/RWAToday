    <text x="0" y="398" font-family="Arial, sans-serif" font-size="13" fill="#5A8068">RWA news since 2026 · Tokenized economy · No ads · No hype</text>
    <text x="0" y="422" font-family="Arial, sans-serif" font-size="13" fill="#5A8068">91 articles published · 10 weekly issues · 5 series</text>

    <!-- Subscriber call to action -->
    <rect x="0" y="450" width="440" height="50" rx="6" fill="#112418" stroke="#3DAA6E" stroke-width="1.5"/>
    <text x="220" y="481" font-family="Arial, sans-serif" font-size="15" fill="#3DAA6E" text-anchor="middle" font-weight="700">rwatoday.beehiiv.com/subscribe</text>
